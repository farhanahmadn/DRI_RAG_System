name: Deploy DRISleman-ai ke VPS1 (ml)

on:
  push:
    branches: [main]

jobs:
  # Gerbang: deploy TIDAK jalan kalau suite offline merah. Sebelumnya push ke main langsung
  # rsync+restart PM2 tanpa menjalankan satu test pun — 528 test hijau tidak menjaga apa pun.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # pyproject: requires-python >=3.11. IDEALNYA disamakan dgn versi Python di VPS supaya
          # gerbang ini benar-benar mewakili runtime produksi — belum diverifikasi, sesuaikan
          # begitu versi di VPS diketahui.
          python-version: "3.11"
          cache: pip

      # Cukup extra [dev] (pytest, httpx): seluruh impor berat (psycopg, torch, transformers) LAZY di
      # dalam fungsi, dan suite offline dipaksa RETRIEVER=mock oleh tests/conftest.py. Jangan
      # tambahkan [rag] di sini: menarik torch ~2-3GB tanpa dipakai sama sekali.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Suite offline (tanpa API key / DB)
        run: pytest -q -m "not live"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: rsync source ke VPS (ml user)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # 'logs/' WAJIB di-exclude: folder itu ada di .gitignore sehingga checkout CI tidak
          # memilikinya, dan --delete menghapus apa pun di tujuan yang tak ada di sumber —
          # artinya logs/precheck.jsonl di VPS (satu-satunya rekaman request/response +
          # diagnostik sebab low_confidence) terhapus SETIAP kali deploy. Pola sama dgn
          # '.env' & 'data/': berkas milik VPS, bukan milik repo.
          switches: -avz --delete --exclude '.venv/' --exclude '.git/' --exclude '__pycache__/' --exclude '.env' --exclude 'data/' --exclude 'logs/'
          path: .
          remote_path: /home/ml/project-2026-07-DRISleman-ai/
          remote_host: ${{ secrets.ML_HOST }}
          remote_user: ${{ secrets.ML_USER }}
          remote_key: ${{ secrets.ML_SSH_KEY }}

      - name: Install deps + restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ML_HOST }}
          username: ${{ secrets.ML_USER }}
          key: ${{ secrets.ML_SSH_KEY }}
          script: |
            cd /home/ml/project-2026-07-DRISleman-ai
            if [ -f .venv/bin/activate ]; then
              . .venv/bin/activate
              pip install -q -e ".[rag-serverless]" || pip install -q -e ".[rag]" || true
            else
              python -m venv .venv && . .venv/bin/activate && pip install -q -e ".[rag-serverless]"
            fi
            # PM2 v7 (daemon ml) — /usr/bin/pm2 adalah v6 (daemon beda) -> "Process not found"
            export PATH="$HOME/.npm-global/bin:$PATH"
            $HOME/.npm-global/bin/pm2 restart 4005-drisman-ai --update-env